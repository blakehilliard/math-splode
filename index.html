<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math-splode</title>
<style>
  :root {
    --bg: #fff4e0; --fg: #2a1d10; --card: #fff; --muted: #8a7660;
    --add: #2fa84f; --sub: #2c7bff; --mul: #e8562a;
    --ok: #1f9d55; --bad: #d64545;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font-family: "Trebuchet MS", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .screen { max-width: 900px; margin: 0 auto; min-height: calc(100% - 8px); display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }
  h1 { text-align: center; font-size: clamp(2.2rem, 7vw, 4rem); margin: 12px 0 24px; letter-spacing: 1px; }
  button { font: inherit; cursor: pointer; border: none; color: #fff; }

  /* ----- Menu ----- */
  #opButtons { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; flex: 1; align-content: center; }
  .op-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 200px; border-radius: 24px; padding: 20px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s;
  }
  .op-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .op-addition { background: var(--add); }
  .op-subtraction { background: var(--sub); }
  .op-multiplication { background: var(--mul); }
  .op-symbol { font-size: 4rem; line-height: 1; font-weight: 700; }
  .op-name { font-size: 1.8rem; font-weight: 700; }
  .op-level { font-size: 1.2rem; background: rgba(0,0,0,.2); padding: 4px 14px; border-radius: 999px; }
  #voiceStatus { text-align: center; color: var(--muted); margin-top: 24px; }
  footer { text-align: center; font-size: .85rem; margin-top: 8px; }
  footer a { color: var(--muted); }

  /* ----- Round ----- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 1.3rem; font-weight: 700; }
  #quitBtn { background: #6b5a48; padding: 10px 18px; border-radius: 12px; font-size: 1.1rem; }
  #clock { font-variant-numeric: tabular-nums; font-size: 1.6rem; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
  #question { font-size: clamp(3.5rem, 14vw, 7rem); font-weight: 700; min-height: 1.2em; }
  #countdown { width: min(600px, 100%); height: 18px; background: #e8dccb; border-radius: 9px; overflow: hidden; }
  #countdownFill { height: 100%; width: 100%; background: var(--add); }
  #countdownFill.low { background: var(--bad); }
  #feedback { font-size: 1.6rem; min-height: 2.2em; }
  #feedback.ok { color: var(--ok); font-weight: 700; }
  #feedback.bad { color: var(--bad); }
  #feedback.listening { color: var(--muted); }
  #mic { font-size: 2.5rem; transition: transform .08s; }

  /* ----- Victory ----- */
  #victory .stage h2 { font-size: clamp(3.5rem, 15vw, 8rem); margin: 0; color: var(--mul); text-shadow: 0 5px 0 rgba(0,0,0,.15); }
  .stat { font-size: 1.6rem; }
  #victoryLevel.levelup { font-size: 2rem; font-weight: 700; color: var(--add); }
  .actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .actions button { font-size: 1.5rem; padding: 18px 32px; border-radius: 18px; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #againBtn { background: var(--add); }
  #menuBtn { background: var(--sub); }
</style>
</head>
<body>

<section id="menu" class="screen">
  <h1>💣 Math-splode</h1>
  <div id="opButtons"></div>
  <div id="voiceStatus"></div>
  <footer><a href="speech-test.html">Speech test page</a></footer>
</section>

<section id="play" class="screen" hidden>
  <div class="topbar">
    <button id="quitBtn">✕ Quit</button>
    <span id="playTitle"></span>
    <span id="clock">0:00</span>
  </div>
  <div class="stage">
    <div id="remaining"></div>
    <div id="question"></div>
    <div id="countdown"><div id="countdownFill"></div></div>
    <div id="mic">🎤</div>
    <div id="feedback"></div>
  </div>
</section>

<section id="victory" class="screen" hidden>
  <div class="stage">
    <h2>VICTORY!</h2>
    <div class="stat">Time: <b id="victoryTime"></b></div>
    <div class="stat" id="victoryMisses"></div>
    <div class="stat" id="victoryLevel"></div>
    <div class="actions">
      <button id="againBtn">Play again</button>
      <button id="menuBtn">Main menu</button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
